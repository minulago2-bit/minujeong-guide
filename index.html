function csv(t){var rows=[],r=[],c="",q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=""}
    else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=""}
    else if(ch!=='\r')c+=ch}
  if(c!==""||r.length){r.push(c);rows.push(r)}
  return rows}
function toObjs(rows){var hd=rows[0]||[];
  return rows.slice(1).filter(function(r){return r[0]!==undefined&&String(r[0]).charAt(0)!=="#"&&r.some(function(x){return x!==""})}).map(function(r){var o={};hd.forEach(function(k,i){o[k]=r[i]===undefined?"":r[i]});return o})}
