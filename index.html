itle_zh": "通仁市场 통인시장", "body_ko": "엽전으로 반찬을 골라 담는 도시락 카페가 유명합니다. 시장 구경과 함께 간단한 한 끼로 좋아요.", "body_en": "Pay with brass coins to fill a lunch box with side dishes. Good for a light meal and a market stroll.", "body_ja": "銅銭でおかずを選ぶお弁当が人気です。市場散策と軽い食事に。", "body_zh": "用铜钱挑选小菜装满饭盒，很有名。适合逛市场和吃简餐。", "ja_ok": "N", "zh_ok": "N", "url": "https://www.google.com/maps/search/?api=1&query=%ED%86%B5%EC%9D%B8%EC%8B%9C%EC%9E%A5%20%EC%84%9C%EC%9A%B8%20%EC%A2%85%EB%A1%9C%EA%B5%AC"}, {"id": "eat_12", "menu": "eat", "order": "12", "show": "Y", "type": "일반", "title_ko": "토속촌 삼계탕", "title_en": "Tosokchon Samgyetang 토속촌 삼계탕", "title_ja": "土俗村 参鶏湯 토속촌 삼계탕", "title_zh": "土俗村参鸡汤 토속촌 삼계탕", "body_ko": "서촌의 대표적인 삼계탕집입니다. 식사 시간에는 줄이 길 수 있습니다.", "body_en": "A well-known ginseng chicken soup restaurant in Seochon. Expect a line at mealtimes.", "body_ja": "西村を代表する参鶏湯の店。食事時は行列になることも。", "body_zh": "西村代表性的参鸡汤店，用餐时间常需排队。", "ja_ok": "N", "zh_ok": "N", "url": "https://www.google.com/maps/search/?api=1&query=%ED%86%A0%EC%86%8D%EC%B4%8C%20%EC%82%BC%EA%B3%84%ED%83%95%20%EC%84%9C%EC%B4%8C"}, {"id": "course_01", "menu": "course", "order": "1", "show": "Y", "type": "일반", "title_ko": "경복궁 반나절", "title_en": "Half-day at the palace", "title_ja": "景福宮 半日", "title_zh": "景福宫半日游", "body_ko": "아침 경복궁 → 국립민속박물관 → 서촌 골목 산책 → 통인시장에서 점심. 궁은 오전이 한산합니다.", "body_en": "Gyeongbokgung (경복궁) in the morning → National Folk Museum (국립민속박물관) → Seochon (서촌) alleys → lunch at Tongin Market (통인시장). The palace is calmer before noon.", "body_ja": "朝の景福宮（경복궁）→ 国立民俗博物館（국립민속박물관） → 西村（서촌）の路地 → 通仁市場（통인시장）で昼食。宮は午前中が静かです。", "body_zh": "上午景福宫（경복궁）→ 国立民俗博物馆（국립민속박물관） → 西村（서촌）小巷 → 通仁市场（통인시장）午餐。上午的宫殿更安静。", "ja_ok": "N", "zh_ok": "N", "url": ""}, {"id": "course_02", "menu": "course", "order": "2", "show": "Y", "type": "일반", "title_ko": "비 오는 날", "title_en": "Rainy day", "title_ja": "雨の日", "title_zh": "雨天", "body_ko": "박노수미술관에서 한옥과 전시를 함께 보고, 서촌 카페에서 쉬어 가세요.", "body_en": "See a hanok and an exhibition at Park Ro-soo Museum (박노수미술관), then rest at a Seoch /* ---------- 시트 읽기 ---------- */
function csv(t){var rows=[],r=[],c="",q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=""}
    else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=""}
    else if(ch!=='\r')c+=ch}
  if(c!==""||r.length){r.push(c);rows.push(r)}
  return rows}
function toObjs(rows){var hd=rows[0]||[];
  return rows.slice(1).filter(function(r){return r[0]!==undefined&&String(r[0]).charAt(0)!=="#"&&r.some(function(x){return x!==""})}).map(function(r){var o={};hd.forEach(function(k,i){o[k]=r[i]===undefined?"":r[i]});return o})}
