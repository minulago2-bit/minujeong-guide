/* ---------- 시트 읽기 ---------- */
function csv(t){var rows=[],r=[],c="",q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=""}
    else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=""}
    else if(ch!=='\r')c+=ch}
  if(c!==""||r.length){r.push(c);rows.push(r)}
  return rows}
function toObjs(rows){var hd=rows[0]||[];
  return rows.slice(1).filter(function(r){return r[0]!==undefined&&String(r[0]).charAt(0)!=="#"&&r.some(function(x){return x!==""})}).map(function(r){var o={};hd.forEach(function(k,i){o[k]=r[i]===undefined?"":r[i]});return o})}
function fetchTab(name){
  var u="https://docs.google.com/spreadsheets/d/"+encodeURIComponent(SHEET)+"/gviz/tq?tqx=out:csv&headers=1&sheet="+encodeURIComponent(name);
  return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("http");return r.text()}).then(function(t){if(/^\s*</.test(t))throw new Error("html");return toObjs(csv(t))})}
function load(){
  if(!SHEET)return Promise.resolve(false);
  var ks=Object.keys(TABS);
  return Promise.all(ks.map(function(k){return fetchTab(TABS[k])})).then(function(a){
    var raw={};ks.forEach(function(k,i){raw[k]=a[i]});
    if(!raw.menu.length||!raw.items.length)throw new Error("empty");
    var s=JSON.stringify(raw);SYNC=new Date().toLocaleTimeString();
    if(s!==LAST){LAST=s;apply(raw,"Google 시트");try{localStorage.setItem("mj_cache_"+SHEET,JSON.stringify({v:SNAP_VER,raw:raw}))}catch(e){}}
    else SRC="Google 시트";
    return true}).catch(function(){return false})}

/* ---------- data/*.json 읽기 ---------- */
/* 파일마다 따로 읽어서, 하나가 깨져도 그 파일만 마지막 정상본 → 내장 비상 정보 순으로 대체한다 */
function fetchFile(k){
  function fallback(){try{var c=JSON.parse(localStorage.getItem("mj_data_"+k)||"null");if(Array.isArray(c))return c}catch(err){}return SNAP[k]||[]}
  return fetch("data/"+FILES[k]+".json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error("http");return r.text()}).then(function(t){
    var a=JSON.parse(t);if(!Array.isArray(a))throw new Error("shape");
    a=a.filter(function(x){return x&&typeof x==="object"});
    try{localStorage.setItem("mj_data_"+k,JSON.stringify(a))}catch(err){}
    return a}).catch(function(){if(window.console)console.warn("data/"+FILES[k]+".json 을 읽지 못해 이전 사본을 사용합니다");return fallback()})}
function loadData(){
  var ks=Object.keys(FILES);
  return Promise.all(ks.map(fetchFile)).then(function(a){
    var raw={};ks.forEach(function(k,i){raw[k]=a[i]});
    if(!raw.menu.length||!raw.items.length){raw.menu=SNAP.menu;raw.items=SNAP.items}
    var s=JSON.stringify(raw);
    if(s!==LAST){LAST=s;apply(raw,"data 폴더")}
    return true})}
function refresh(){return SHEET?load():loadData()}

/* ---------- 정규화 ---------- */
function yes(v){return !/^\s*(n|no|false|0|숨김|아니오)\s*$/i.test(String(v||""))}
function yes2(v){return /^\s*(y|yes|true|1|예)\s*$/i.test(String(v||""))}
function ord(a,b){return (parseFloat(a.order)||999)-(parseFloat(b.order)||999)}
function cleanUrl(u){u=String(u||"").trim();return /^https:\/\/\S+$/.test(u)?u:""}
function tr(s){return String(s||"").replace(/\{\{(\w+)\}\}/g,function(m,k){return CFG[k]?CFG[k]:TODO})}
function detectLang(){
  var c=[];try{c=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||navigator.userLanguage||""])}catch(e){}
  for(var i=0;i<c.length;i++){var s=String(c[i]||"").toLowerCase();if(s.indexOf("ko")===0)return "ko";if(s.indexOf("ja")===0)return "ja";if(s.indexOf("zh")===0)return "zh";if(s.indexOf("en")===0)return "en"}
  return "en";
}
function apply(raw,src){
  CFG={};raw.cfg.forEach(function(r){CFG[r.key]=r.value});
  IMG={};raw.images.forEach(function(r){var u=String(r.url||"").trim();if(/^https:\/\/\S+$/.test(u)||/^[\w\-\/]+\.(jpe?g|png|webp)$/i.test(u))IMG[r.key]=u});
  var ui={};raw.ui.forEach(function(r){ui[r.key]=r});
  var menus=raw.menu.filter(function(m){return yes(m.show)}).sort(ord);
  var items=raw.items.filter(function(m){return yes(m.show)}).sort(ord);
  var slides=raw.idle.filter(function(m){return yes(m.show)}).sort(ord);
  D={};
  LANGS.forEach(function(l){
    var o={},f=function(r,k){return r[k+"_"+l]||r[k+"_en"]||""};
    ["brand","sub","home","taxiBtn","taxiTxt","taxiClose","touch","langBtn","honorific","qrBtn","qrHint","qrNote","qrClose"].forEach(function(k){o[k]=ui[k]?(ui[k][l]||ui[k].en||""):""});
    o.greet=[0,1,2,3].map(function(i){return ui["greet_"+i]?(ui["greet_"+i][l]||ui["greet_"+i].en||""):""});
    o.tiles=menus.map(function(m){return {id:m.id,t:f(m,"title"),s:tr(f(m,"sub")),sos:yes2(m.sos)}});
    o.sec={};menus.forEach(function(m){o.sec[m.id]={d:tr(f(m,"desc")),taxi:yes2(m.taxi),i:[]}});
    items.forEach(function(it){var s=o.sec[it.menu];if(!s)return;
      s.i.push([f(it,"title"),tr(f(it,"body")),(it.type==="긴급번호"||it.type==="hot")?1:0,cleanUrl(tr(it.url)),it.id])});
    o.slides=slides.filter(function(s){return !(yes2(s.photo_only)&&!IMG[s.image_key])}).map(function(s){return {t:f(s,"title"),c:f(s,"caption"),img:s.image_key,tod:s.tod,art:s.art}});
    D[l]=o});
  W={};raw.welcome.filter(function(r){return yes(r.show)}).forEach(function(r){W[r.code]={n:r.name,l:r.lang,g:r.greeting,s:r.sub,b:r.button}});
  if(!langSet)L=detectLang();
  SRC=src;
  if(!D[L])L="en";
  render();idleReset(true);
}

function bgcss(u){return 'url("'+u.replace(/"/g,"%22").replace(/\\/g,"")+'")'}
function render(){

  $("brand").innerHTML=h(d.brand)+"<small>"+h(d.sub)+"</small>";

  $("langBtn").textContent=d.langBtn;
  var hb=(V==="home"&&IMG.home_bg);

function idleReset(quiet){
